<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChromaClock - 沒用的色彩時鐘</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            transition: background-color 1s ease;
        }
        #clock-container {
            background: rgba(255, 255, 255, 0.8);
            padding: 30px 50px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        #time { font-size: 4rem; font-weight: bold; color: #333; }
        #color-code { font-size: 1.5rem; color: #666; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="clock-container">
        <div id="time">00:00:00</div>
        <div id="color-code">#000000</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let seconds = String(now.getSeconds()).padStart(2, '0');

            // 組合時間
            document.getElementById('time').innerText = `${hours}:${minutes}:${seconds}`;

            // 把時間變成顏色代碼 (例如 14:25:36 -> #142536)
            let hexColor = `#${hours}${minutes}${seconds}`;
            document.body.style.backgroundColor = hexColor;
            document.getElementById('color-code').innerText = hexColor;
        }

        setInterval(updateClock, 1000);
        updateClock(); // 初始化
    </script>
</body>
</html>
